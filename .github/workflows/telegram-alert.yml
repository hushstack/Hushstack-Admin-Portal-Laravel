name: Telegram GitHub Alerts

on:
  push:
  create:
  pull_request:
    types: [closed]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram alert
        env:
          TELEGRAM_BOT_TOKEN: '7862482571:AAH-NV34GtzkBy07sgqCJSyga130cV5HDUY'
          TELEGRAM_CHAT_ID: '-1003388054167'
          TELEGRAM_THREAD_ID: '120'
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          CREATED_REF_TYPE: ${{ github.event.ref_type }}
          CREATED_REF: ${{ github.event.ref }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            TEXT="🚀 Push Alert%0ARepository: $REPO%0ABy: $ACTOR%0ABranch: $REF_NAME%0ACommit: $COMMIT_MESSAGE"
          elif [ "$EVENT_NAME" = "create" ] && [ "$CREATED_REF_TYPE" = "branch" ]; then
            TEXT="🌱 New Branch Created%0ARepository: $REPO%0ABy: $ACTOR%0ABranch: $CREATED_REF"
          elif [ "$EVENT_NAME" = "pull_request" ] && [ "$PR_MERGED" = "true" ]; then
            TEXT="✅ Pull Request Merged%0ARepository: $REPO%0ABy: $ACTOR%0ATitle: $PR_TITLE%0AURL: $PR_URL"
          else
            echo "No message to send for this event."
            exit 0
          fi

          if [ -n "$TELEGRAM_THREAD_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              -d "message_thread_id=${TELEGRAM_THREAD_ID}" \
              -d "text=${TEXT}"
          else
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              -d "text=${TEXT}"
          fi
